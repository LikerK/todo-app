<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main id="app">
        <h1 id="title">Список задач</h1>
        <form id="task-form" class="task-form">
            <div class="task-form__row">
                <div class="task-form__field">
                    <label for="task-input" class="task-form__label">Название задачи</label>
                    <input 
                        id="task-input"
                        placeholder="Например, прочитать статью"
                        name="title"
                        type="text"
                        class="task-form__input"
                        aria-describedby="task-error"
                        aria-invalid="false"
                    />
                </div>
               <button id="add-task-button" type="submit" class="task-form__submit">Добавить</button>
            </div>

            <span id="valid-message" class="error task-form__error" role="alert"></span>
        </form>

        <div id="filter">
            <label for="status-filter">Показать задачи со статусом</label>
            <select id="status-filter" class="select" name="filter">
                <option value="all">Все</option>
                <option value="new">Новая</option>
                <option value="in-progress">В работе</option>
                <option value="done">Готово</option>
            </select>
        </div>

        <div id="tasks"></div>
    </main>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
