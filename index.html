<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
</head>

<body>
    <main id="app">
        <h1 id="title">Список задач</h1>
        <p>Название задачи</p>
        <form id="task-form">
            <input 
                id="task-input"
                name="title"
                type="text"
                aria-describedby="task-error"
                aria-invalid="false"
            />
            <span id="task-error" class="error" role="alert"></span>
            <button id="add-task-button" type="submit">Добавить</button>
        </form>

        <div class="filter">
            <label for="status-filter">Показать задачи со статусом</label>
            <select id="status-filter" name="filter">
                <option value="all">Все</option>
                <option value="new">Новая</option>
                <option value="in-progress">В работе</option>
                <option value="done">Готово</option>
            </select>
        </div>

        <div id="tasks"></div>
    </main>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
